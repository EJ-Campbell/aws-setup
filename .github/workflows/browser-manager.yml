name: browser-manager
on:
  pull_request:
    paths: ['browser-manager/**', 'browser-manager.tf', '.github/workflows/browser-manager.yml']
  push:
    branches: [main]
    paths: ['browser-manager/**', 'browser-manager.tf', '.github/workflows/browser-manager.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-manager
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-manager/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install native VNC regression prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends x11vnc
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: bash -n scripts/install.sh
