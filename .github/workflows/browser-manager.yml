name: browser-manager
on:
  pull_request:
    paths: ['browser-manager/**', 'browser-manager.tf', '.github/workflows/browser-manager.yml']
  push:
    branches: [main]
    paths: ['browser-manager/**', 'browser-manager.tf', '.github/workflows/browser-manager.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-manager
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-manager/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install native VNC regression prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends x11vnc
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: bash -n scripts/install.sh
      - run: node --check scripts/configure-openclaw-viewer.mjs

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.3
      - run: terraform fmt -check browser-manager.tf
      - run: terraform init -backend=false
      - run: terraform validate
